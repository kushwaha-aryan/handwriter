<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handwriter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat&family=Kalam&family=Patrick+Hand&family=Playpen+Sans&family=Shantell+Sans&family=Gochi+Hand&family=Indie+Flower&family=Handlee&family=Shadows+Into+Light&family=Architects+Daughter&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--bd:#d9d6cc;--ac:#2d5bd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececea;--card:#222226;--bd:#3a3a40;--ac:#7ea0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececea;--card:#222226;--bd:#3a3a40;--ac:#7ea0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
h1{font-size:20px;margin:0 0 4px}p.s{margin:0 0 12px;opacity:.7;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
textarea{width:100%;min-height:260px;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg);color:var(--fg);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
label.mixb{margin:0 0 12px;padding:12px 14px;border:2px solid var(--ac);border-radius:10px;font-size:18px;font-weight:600;cursor:pointer}
label.mixb input{width:26px;height:26px;accent-color:var(--ac);flex:none;max-width:none}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0 0;font-size:13px}
select,input[type=range],input[type=color]{max-width:190px;width:100%}
select{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#out{display:flex;flex-direction:column;gap:14px}
#out canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
#msg{font-size:13px;opacity:.75;margin-top:8px;min-height:18px}
</style></head><body>
<div class="wrap">
<div>
<div class="card">
<h1>Handwriter</h1><p class="s">Paste text → get a handwritten page. Every letter has 10 hand-drawn variants from different handwritings picked at random, so no two “a”s match.</p>
<label class="mixb"><span>Mix handwritings per letter</span><input id="mx" type="checkbox" checked></label>
<textarea id="t" placeholder="Paste your text here…">MLT Theory Assignment
11-11-2026

AI24303/24304 Machine Learning Techniques
Theory Assignment

Aryan Kushwaha
BTech/15050/24
Artificial Intelligence &amp; Machine Learning
Vth Semester

</textarea>
<label>Handwriting<select id="f"><option>Caveat</option><option>Kalam</option><option>Patrick Hand</option><option>Playpen Sans</option><option>Shantell Sans</option><option>Gochi Hand</option></select></label>
<label>Size<input id="sz" type="range" min="28" max="70" value="44"></label>
<label>Line spacing<input id="ls" type="range" min="1.0" max="2.0" step=".05" value="1.45"></label>
<label>Messiness<input id="ms" type="range" min="0" max="2" step=".1" value="1"></label>
<label>Ink<input id="ink" type="color" value="#1c2f6b"></label>
<label>Paper<select id="pp"><option value="r">Ruled + margin</option><option value="p">Plain</option></select></label>
<div class="row"><button id="go">Generate</button><button class="g" id="rs">Reshuffle</button></div>
<div class="row"><button class="g" id="pdf">Save PDF</button><button class="g" id="png">Save PNGs</button></div>
<div id="msg"></div>
</div></div>
<div id="out"></div>
</div>
<script>
const W=1240,H=1754,NV=10;
const $=i=>document.getElementById(i);
let pages=[],seed=1;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// 5 fixed variants per character (deterministic per char + seed)
const VC={};
function variant(ch,k,ms){const key=ch+k+'|'+seed;if(VC[key])return VC[key];const r=mul(ch.codePointAt(0)*131+k*977+seed*7919);
 return VC[key]={rot:(r()-.5)*.16,sk:(r()-.5)*.34,sx:.92+r()*.16,sy:.92+r()*.16,dy:(r()-.5)*.12,lw:r()*.9}}
const MATH='βαλΣ∂',FL=['Caveat','Kalam','Patrick Hand','Playpen Sans','Shantell Sans','Gochi Hand','Indie Flower','Handlee','Shadows Into Light','Architects Daughter'],FS=[1.22,1,1.05,.92,.95,1,1,1,1.15,.95];
function mathGlyph(ctx,ch,u,rnd,ms){
 const j=()=>(rnd()-.5)*.1*ms,P=(a,b)=>[(a+j())*u,(b+j())*u];
 ctx.lineWidth=u*(.055+rnd()*.025);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 const mv=(a,b)=>{const p=P(a,b);ctx.moveTo(p[0],p[1])},ln=(a,b)=>{const p=P(a,b);ctx.lineTo(p[0],p[1])},
 bz=(a,b,c,d,e,f)=>{const p=P(a,b),q=P(c,d),s=P(e,f);ctx.bezierCurveTo(p[0],p[1],q[0],q[1],s[0],s[1])};
 const st=Math.floor(rnd()*3);let w=.6;
 if(ch=='β'){w=.58;
  if(st==0){mv(.05,.28);bz(.04,0,.02,-.4,.1,-.68);bz(.3,-.85,.52,-.6,.2,-.38);bz(.6,-.3,.55,.02,.1,-.02)}
  else if(st==1){mv(0,.3);ln(.1,-.7);bz(.45,-.8,.5,-.4,.12,-.36);bz(.6,-.35,.55,.05,0,-.03)}
  else{mv(.08,.25);bz(.05,-.1,.05,-.5,.12,-.7);bz(.4,-.8,.55,-.45,.1,-.38);bz(.5,-.4,.62,0,.18,-.02);bz(.1,0,.02,-.05,-.02,-.1)}}
 else if(ch=='α'){w=.62;
  if(st==0){mv(.52,-.42);bz(.35,-.55,.02,-.45,.03,-.2);bz(.05,.04,.4,.04,.52,-.4);mv(.45,-.45);bz(.46,-.25,.5,-.1,.58,0)}
  else if(st==1){mv(.5,-.38);bz(.3,-.58,0,-.4,.05,-.15);bz(.1,.05,.35,0,.48,-.35);ln(.55,0)}
  else{mv(.55,-.45);bz(.3,-.5,0,-.3,.05,-.1);bz(.12,.06,.45,.02,.5,-.45);bz(.5,-.2,.52,-.05,.6,.02)}}
 else if(ch=='λ'){w=.6;
  if(st==0){mv(.03,-.72);bz(.2,-.7,.3,-.4,.55,0);mv(.32,-.32);bz(.2,-.15,.1,-.05,0,.02)}
  else if(st==1){mv(.02,-.7);ln(.55,.02);mv(.3,-.3);ln(.04,.02)}
  else{mv(.05,-.72);bz(.25,-.6,.35,-.3,.58,.02);mv(.34,-.28);bz(.22,-.1,.1,0,0,0)}}
 else if(ch=='Σ'){w=.62;
  if(st!=1){mv(.52,-.68);ln(.05,-.68);ln(.32,-.34);ln(.02,0);ln(.55,0)}
  else{mv(.5,-.7);bz(.3,-.72,.1,-.7,.04,-.66);bz(.2,-.5,.3,-.4,.34,-.35);bz(.25,-.25,.1,-.1,.02,0);bz(.2,.03,.4,0,.56,-.1)}}
 else{w=.58;
  if(st!=1){mv(.38,-.42);bz(.1,-.55,-.02,-.05,.18,0);bz(.45,.05,.55,-.45,.38,-.65);bz(.3,-.78,.15,-.75,.08,-.66)}
  else{mv(.4,-.4);bz(.1,-.5,0,.02,.22,.02);bz(.5,.04,.55,-.5,.36,-.7);bz(.3,-.8,.2,-.78,.1,-.7)}}
 ctx.stroke();return (w+.1+rnd()*.05)*u}
async function render(){
 const font=$('f').value,size=+$('sz').value,lh=size*+$('ls').value,ms=+$('ms').value,ink=$('ink').value,paper=$('pp').value;
 const stack=`"${font}","Playpen Sans",cursive`;
 const text=$('t').value.replace(/\r/g,'');
 const mix=$('mx').checked;
 try{if(mix)for(const f of FL)await document.fonts.load(`${size}px "${f}"`,'abc');await document.fonts.load(`${size}px "${font}"`,text.slice(0,200));await document.fonts.load(`${size}px "Playpen Sans"`,'βλαΣ∂')}catch(e){}
 const ML=paper=='r'?170:110,MR=90,MT=150,MB=120;
 pages=[];let c,x,ctx,y;
 const rnd=mul(seed*104729+13);
 function np(){c=document.createElement('canvas');c.width=W;c.height=H;ctx=c.getContext('2d');
  ctx.fillStyle='#fdfcf8';ctx.fillRect(0,0,W,H);
  if(paper=='r'){ctx.strokeStyle='#bcd0e6';ctx.lineWidth=2;for(let yy=MT;yy<H-MB+lh;yy+=lh){ctx.beginPath();ctx.moveTo(0,yy+8);ctx.lineTo(W,yy+8);ctx.stroke()}
   ctx.strokeStyle='#e9a1a1';ctx.beginPath();ctx.moveTo(ML-35,0);ctx.lineTo(ML-35,H);ctx.stroke()}
  ctx.font=`${size}px ${stack}`;ctx.textBaseline='alphabetic';
  pages.push(c);x=ML;y=MT}
 np();
 const wd=w=>{let s=0;for(const ch of w)s+=ctx.measureText(ch).width*.98;return s};
 const lines=text.split('\n');
 for(const ln of lines){
  const words=ln.split(/(\s+)/).filter(s=>s.length);
  for(const w of words){
   ctx.font=`${size}px ${stack}`;
   const ww=wd(w);
   if(x+ww>W-MR&&x>ML&&!/^\s+$/.test(w)){x=ML;y+=lh}
   if(y>H-MB){np()}
   for(const ch of w){
    const k=Math.floor(rnd()*NV);
    ctx.font=mix?`${size*FS[k]}px "${FL[k]}","Playpen Sans",cursive`:`${size}px ${stack}`;
    const m=ctx.measureText(ch).width;
    if(ch==' '||ch=='\t'){x+=m*(.9+rnd()*.3);continue}
    const drift=Math.sin(x/190+y)*2.2*ms;
    if(MATH.includes(ch)){
     ctx.save();ctx.translate(x,y+drift+(rnd()-.5)*2*ms);ctx.rotate((rnd()-.5)*.14*ms);ctx.strokeStyle=ink;ctx.globalAlpha=.88+rnd()*.12;
     const a=mathGlyph(ctx,ch,size*.95,rnd,ms);ctx.restore();x+=a;continue}
    const v=variant(ch,k,ms);
    ctx.save();
    ctx.translate(x+(rnd()-.5)*1.2*ms,y+drift+v.dy*size*ms+(rnd()-.5)*1.4*ms);
    ctx.rotate(v.rot*ms+(rnd()-.5)*.03*ms);
    ctx.transform(1,0,v.sk*ms,1,0,0);
    ctx.scale(1+(v.sx-1)*ms,1+(v.sy-1)*ms);
    const sh=.88+rnd()*.12;ctx.fillStyle=ink;ctx.globalAlpha=sh;
    ctx.fillText(ch,0,0);
    if(v.lw>.2){ctx.strokeStyle=ink;ctx.lineWidth=v.lw;ctx.lineJoin='round';ctx.strokeText(ch,0,0)}
    ctx.restore();
    x+=m*v.sx*(.96+rnd()*.08);
   }
  }
  x=ML;y+=lh;if(y>H-MB&&ln!==lines[lines.length-1])np();
 }
 const o=$('out');o.innerHTML='';pages.forEach(p=>o.appendChild(p));
 $('msg').textContent=pages.length+' page'+(pages.length>1?'s':'')+' generated.';
}
function anchorSave(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function save(name,blob){
 let d=null;
 try{d=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){d=null}
 if(!d){anchorSave(name,blob);$('msg').textContent='Downloading '+name+'…';return}
 try{await d.save({filename:name,data:blob});$('msg').textContent='Saved '+name}
 catch(e){$('msg').textContent=e&&e.code=='declined'?'Save declined.':'Save failed ('+((e&&e.code)||'error')+'). Right-click or long-press a page image to save it.'}
}
const toBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
$('go').onclick=render;
$('rs').onclick=()=>{seed=Math.floor(Math.random()*1e6);render()};
let pi=0;$('png').onclick=async()=>{const i=pi%pages.length;pi++;await save(`handwritten-page-${i+1}.png`,await toBlob(pages[i]));$('png').textContent='Save PNG (page '+((pi%pages.length)+1)+' next)'};
$('pdf').onclick=async()=>{
 if(!window.jspdf){$('msg').textContent='PDF library did not load; use Save PNGs.';return}
 const d=new jspdf.jsPDF({unit:'mm',format:'a4'});
 pages.forEach((p,i)=>{if(i)d.addPage();d.addImage(p.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)});
 await save('handwritten.pdf',d.output('blob'))};
['f','sz','ls','ms','ink','pp','mx'].forEach(i=>$(i).addEventListener('change',render));
render();
</script></body></html>
